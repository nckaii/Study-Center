    </div>

    <!-- GAME 7 -->
    <div class="card">
      <div class="card-content">

        <h3>Football Legends 2021</h3>

        <p>Soccer arcade game.</p>

        <button class="btn"
          onclick="loadGame(
          'https://html5.gamedistribution.com/ecd138ae69cf4e92b5f5cdd328b6b62e/?gd_sdk_referrer_url=https://fun.symbaloo.com/',
          this
