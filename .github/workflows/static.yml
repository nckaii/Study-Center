        </button>

      </div>
    </div>

  </section>

  <footer>

    <p>
      Created by nckaii
    </p>

  </footer>

  <script>

    function loadGame(url, button){

      const card =
        button.parentElement;

      const frame =
        card.querySelector('.game-frame');

      frame.src = url;

    }

    function fullscreenGame(button){

      const frame =
        button.parentElement
        .querySelector('.game-frame');

      if(frame.requestFullscreen){

        frame.requestFullscreen();

      }

    }

    function searchDuckDuckGo(){

      const query =
        document.getElementById(
          'searchInput'
        ).value;

      const frame =
        document.getElementById(
          'searchFrame'
        );

      frame.src =
        'https://duckduckgo.com/?q='
        + encodeURIComponent(query);

    }

  </script>

</body>
</html>
